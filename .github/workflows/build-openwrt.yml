name: 编译固件（RAX3000M-EMMC）

on:
  repository_dispatch:  
    types: [镜像更新触发自动编译固件]
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译方式'
        required: true
        default: 'Host'
        type: choice
        options:
          - Host
          - Docker
      lan_ip:
        description: '设置LAN IP地址'
        required: false
        default: '192.168.3.1'
      default_theme:
        description: '选择默认主题'
        required: false
        default: 'argon'
        type: choice
        options:
          - argon
          - bootstrap
      hostname:
        description: '设置主机名'
        required: false
        default: 'Rowrt'
      high_power_5g:
        description: '5G高功率25db'
        required: false
        default: true
        type: boolean
      ssh:
        description: '通过SSH连接到Actions'
        required: false
        default: false
        type: boolean
      cachewrtbuild_switch:
        description: '缓存加速编译'
        required: false
        default: true
        type: boolean
      # 移除clean_build配置

# 环境变量定义
env:
  # 基础配置
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # 用户可配置参数 - 优先使用 workflow_dispatch 输入，其次使用 repository_dispatch 的 client_payload
  LAN_IP: ${{ github.event.inputs.lan_ip || github.event.client_payload.inputs.lan_ip || '192.168.3.1' }}
  DEFAULT_THEME: ${{ github.event.inputs.default_theme || github.event.client_payload.inputs.default_theme || 'argon' }}
  HOSTNAME: ${{ github.event.inputs.hostname || github.event.client_payload.inputs.hostname || 'Rowrt' }}
  HIGH_POWER_5G: ${{ github.event.inputs.high_power_5g || github.event.client_payload.inputs.high_power_5g || false }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || github.event.client_payload.inputs.build_type || 'Host' }}
  SSH: ${{ github.event.inputs.ssh || github.event.client_payload.inputs.ssh || 'false' }}
  CACHEWRTBUILD_SWITCH: ${{ github.event.inputs.cachewrtbuild_switch || github.event.client_payload.inputs.cachewrtbuild_switch || 'true' }}
  # 上传配置
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 统一目录并使用相对路径
  WORK_DIR: .
  SOURCE_DIR: ./openwrt
  # Docker相关配置
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/openwrt-builder:latest
  SRC_OPENWRT_DIR: /opt/openwrt # 容器内置源码目录
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  # 新增缓存相关变量
  CCACHE_DIR: ./openwrt/.ccache
  CCACHE_SIZE: 10G
  CCACHE_COMPRESSION_LEVEL: 6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
    
    - name: 检查代码
      uses: actions/checkout@main

    - name: 设置环境变量
      run: |
        # 根据触发来源设置环境变量
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          # 从repository-dispatch事件获取参数
          echo "REPO_URL=${{ github.event.client_payload.repo_url }}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${{ github.event.client_payload.repo_branch }}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${{ github.event.client_payload.commit_hash }}" >> $GITHUB_ENV
          echo "LAN_IP=${{ github.event.client_payload.lan_ip }}" >> $GITHUB_ENV
          echo "DEFAULT_THEME=${{ github.event.client_payload.default_theme }}" >> $GITHUB_ENV
          echo "HOSTNAME=${{ github.event.client_payload.hostname }}" >> $GITHUB_ENV
          echo "HIGH_POWER_5G=${{ github.event.client_payload.high_power_5g }}" >> $GITHUB_ENV
          echo "SSH=${{ github.event.client_payload.ssh }}" >> $GITHUB_ENV
          echo "CACHEWRTBUILD_SWITCH=${{ github.event.client_payload.cachewrtbuild_switch }}" >> $GITHUB_ENV
          echo "COMMIT_LOGS=${{ github.event.client_payload.commit_logs }}" >> $GITHUB_ENV
          echo "TRIGGER_SOURCE=${{ github.event.client_payload.trigger_source }}" >> $GITHUB_ENV
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 从源码更新检测工作流触发，使用传递的参数"
        else
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 手动触发，使用默认参数或指定参数"
        fi
        
        # 输出当前使用的参数
        echo "使用的源码仓库: ${{ env.REPO_URL }}"
        echo "使用的源码分支: ${{ env.REPO_BRANCH }}"
        if [ -n "${{ env.COMMIT_HASH }}" ]; then
          echo "触发更新的提交哈希: ${{ env.COMMIT_HASH }}"
        fi
        if [ -n "${{ env.TRIGGER_SOURCE }}" ]; then
          echo "触发来源: ${{ env.TRIGGER_SOURCE }}"
        fi
        if [ -n "${{ env.COMMIT_LOGS }}" ]; then
          echo "触发更新的提交日志: ${{ env.COMMIT_LOGS }}"
        fi

    - name: 初始化编译环境（主机模式）
      if: env.BUILD_TYPE == 'Host'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        cd "${{ env.WORK_DIR }}"
        source ${{ env.WORK_DIR }}/build-openwrt.sh
        init_env

    - name: 启动Docker容器（Docker模式）
      if: env.BUILD_TYPE == 'Docker'
      run: |
        echo_color() {
        case "$1" in
            r) local Color="\033[0;31m";; # 红色
            g) local Color="\033[0;32m";; # 绿色
            y) local Color="\033[0;33m";; # 黄色
            b) local Color="\033[0;34m";; # 蓝色
            z) local Color="\033[0;35m";; # 紫色
            l) local Color="\033[0;36m";; # 青色
            *) local Color="\033[0;0m";;  # 默认色
        esac
        echo -e "${Color}${2}\033[0m"
        }
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        FILTERED_TAGS=$(skopeo list-tags docker://ghcr.io/${{ github.repository_owner }}/openwrt-builder | \
        grep -oE '"(ubuntu22.04|latest|[0-9]{12})"' | \
        tr -d '"' | \
        sort -r | \
        awk 'BEGIN{seen["ubuntu22.04"]=0; seen["latest"]=0} { \
          if ($1 ~ /^[0-9]{12}$/) { \
            if (!latest_ts) {latest_ts=$1; print $1} \
          } else if (!seen[$1]++) { \
            print $1 \
          } \
        }')
        echo_color b "本次镜像的标签："
        echo_color g "$FILTERED_TAGS"
        echo_color b "-----------------"
        echo_color l "开始打包环境变量到容器"
        while IFS='=' read -r var value; do
          echo "$var=\"$value\"" >> .env
        done <<< "$(printenv)"
        echo_color l "环境变量打包完成"
        docker pull "${{ env.DOCKER_IMAGE }}"
        
        docker run -d --name builder \
          --env-file .env \
          -v "$PWD":"${{ github.workspace }}":rw \
          -e TZ="${{ env.TZ }}" \
          -e FORCE_UNSAFE_CONFIGURE=1 \
          "${{ env.DOCKER_IMAGE }}" tail -f /dev/null
        echo_color z -e "\n=== 验证容器运行状态 ==="
        docker ps -a | grep builder
        if [ $? -ne 0 ]; then
          echo_color r "❌ 容器启动失败，请查看日志："
          docker logs builder
          exit 1
        fi
        echo_color g "✅ 容器运行正常"
        
        echo -e "\n=== 迁移预置源码到共享目录 ==="
        docker exec builder bash -c '
          echo_color() {
          case "$1" in
              r) local Color="\033[0;31m";; # 红色
              g) local Color="\033[0;32m";; # 绿色
              y) local Color="\033[0;33m";; # 黄色
              b) local Color="\033[0;34m";; # 蓝色
              z) local Color="\033[0;35m";; # 紫色
              l) local Color="\033[0;36m";; # 青色
              *) local Color="\033[0;0m";;  # 默认色
          esac
          echo -e "${Color}${2}\033[0m"
          }
          if [ -d "$SOURCE_DIR" ]; then
            echo_color y "⚠️ 清理共享目录旧内容：""$SOURCE_DIR"
            rm -rf "$SOURCE_DIR"/* "$SOURCE_DIR"/.* 2>/dev/null
          else
            mkdir -p "$SOURCE_DIR" && chmod 777 "$SOURCE_DIR"
          fi
          echo_color l "开始复制源码（含隐藏文件）..."
          cp -a "${SRC_OPENWRT_DIR}/." "${SOURCE_DIR}"
          critical_files=("scripts/feeds" "target/linux" "package")
          for file in "${critical_files[@]}"; do
            check_path="$SOURCE_DIR/$file"
            if [ ! -e "$check_path" ]; then
              echo_color r "❌ 迁移失败：共享目录缺失关键文件 $check_path"
              exit 1
            fi
          done
          echo_color g "✅ 预置源码迁移完成"
          echo_color l "  - 从：$SRC_OPENWRT_DIR"
          echo_color l "  - 到：""$SOURCE_DIR"
          echo_color l "共享目录源码体积：$(du -sh "$SOURCE_DIR" | awk "{print \$1}")"
          cp -f "$WORK_DIR/$CONFIG_FILE" "$SOURCE_DIR/.config" && echo_color g "已加载.config文件"
          cd "$SOURCE_DIR"
          make defconfig > /dev/null 2>&1
        '

    - name: 克隆源码（主机模式）
      if: env.BUILD_TYPE == 'Host'
      run: |
        source ${{ env.WORK_DIR }}/build-openwrt.sh
        prepare_source

    - name: 提取缓存相关变量
      run: |
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
        echo "CACHE_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

    - name: 加载自定义feeds
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.WORK_DIR }}/build-openwrt.sh && load_custom_feeds
        else
          docker exec builder bash -c 'source ${{ env.WORK_DIR }}/build-openwrt.sh && load_custom_feeds'
        fi
    
    - name: 更新并安装feeds
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.WORK_DIR }}/build-openwrt.sh
          update_install_feeds
        else
          docker exec builder bash -c 'source ${{ env.WORK_DIR }}/build-openwrt.sh && update_install_feeds'
        fi
    
    - name: 加载自定义配置
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.WORK_DIR }}/build-openwrt.sh
          load_custom_config
        else
          docker exec builder bash -c 'source ${{ env.WORK_DIR }}/build-openwrt.sh && load_custom_config' 
        fi
      
    - name: SSH远程连接（make menuconfig）
      uses: rogueme/debugger-action@main
      if: (env.SSH == 'true') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        TIMEOUT_MIN: 360
          
    - name: 同步.config（仅SSH模式）
      if: (github.event.inputs.ssh == 'true') || contains(github.event.action, 'ssh')
      run: |
        echo_color() {
        case "$1" in
            r) local Color="\033[0;31m";; # 红色
            g) local Color="\033[0;32m";; # 绿色
            y) local Color="\033[0;33m";; # 黄色
            b) local Color="\033[0;34m";; # 蓝色
            z) local Color="\033[0;35m";; # 紫色
            l) local Color="\033[0;36m";; # 青色
            *) local Color="\033[0;0m";;  # 默认色
        esac
        echo -e "${Color}${2}\033[0m"
        }
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        cd "$WORK_DIR"
        CONFIG_SOURCE="$SOURCE_DIR/.config"
        cp -f "$CONFIG_SOURCE" "$CONFIG_FILE" && echo_color g "已复制$CONFIG_SOURCE到项目根目录"
        if git diff --quiet "$CONFIG_FILE"; then
            echo_color y ".config未修改，无需上传"
        else
            git add "$CONFIG_FILE"
            git commit -m "自动同步SSH修改的.config（Actions #${GITHUB_RUN_NUMBER}）"
            git push "https://${github_token}@github.com/${github_repository}.git" "${github_ref}"
            echo_color g ".config已上传"
        fi

    - name: 提取已选插件列表
      id: extract_plugins
      run: |
        echo_color() {
        case "$1" in
            r) local Color="\033[0;31m";; # 红色
            g) local Color="\033[0;32m";; # 绿色
            y) local Color="\033[0;33m";; # 黄色
            b) local Color="\033[0;34m";; # 蓝色
            z) local Color="\033[0;35m";; # 紫色
            l) local Color="\033[0;36m";; # 青色
            *) local Color="\033[0;0m";;  # 默认色
        esac
        echo -e "${Color}[$(date +'%m-%d %H:%M:%S')] ${2}\033[0m"
        }
        echo_color z "开始提取已选插件列表..."
        plugins=$(grep -E '^CONFIG_PACKAGE_luci-(app|theme)-.*=y$' "$WORK_DIR/$CONFIG_FILE" | 
          awk -F'[=]' '{name = substr($1, 16); print NR "、" name}')
        [ -z "$plugins" ] && plugins="无额外插件（仅基础系统）"
        {
          echo "plugins_list<<EOF"
          echo "$plugins"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo_color g "--已选插件列表--"
        echo -e "$plugins"
       
    - name: 缓存加速编译
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      uses: actions/cache@main
      with:
        key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.HASH }} ${{ env.CACHE_DATE }}
        restore-keys: |
            restore-keys: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
        path: |
          ${{ env.SOURCE_DIR }}/.ccache
          ${{ env.SOURCE_DIR }}/staging_dir

    - name: 刷新缓存
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      run: |
        if [ -d "${{ env.SOURCE_DIR }}/staging_dir" ]; then
          find "${{ env.SOURCE_DIR }}/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
          done
        fi

    - name: 下载软件包
      id: package
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.WORK_DIR }}/build-openwrt.sh && download_packages
        else
          docker exec builder bash -c 'source ${{ env.WORK_DIR }}/build-openwrt.sh && download_packages'
        fi
 
    - name: 释放Ubuntu磁盘空间
      uses: danshui-git/free-disk-space@main
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_docker_image: ${{ github.event.inputs.build_type == 'Host' && 'true' || 'false' }}
        remove_packages: "azure-cli google google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* mono-*"
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /var/cache/apt/archives"
    - name: 查看清理后磁盘空间
      if: (!cancelled())
      run: |
        echo "===== 磁盘空间 ====="
        echo -e "\033[0;35m 系统空间      类型   总数  已用  可用 使用率\033[0m"
        df -hT "$PWD"
        
    - name: 编译固件
      id: compile
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          compile_status="$(source ${{ env.WORK_DIR }}/build-openwrt.sh && compile_firmware 2>&1)"
          compile_exit_code=$?
        else
          compile_status="$(docker exec builder bash -c 'source ${{ env.WORK_DIR }}/build-openwrt.sh && compile_firmware 2>&1')"
          compile_exit_code=$?
        fi
        if [[ $compile_exit_code -ne 0 ]]; then
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        FILE_DATE="_$(date +"%Y%m%d%H%M")"
        echo "FILE_DATE=${FILE_DATE}" >> $GITHUB_ENV

    - name: 检查编译后磁盘空间
      if: (!cancelled())
      run: |
        echo "===== 磁盘空间 ====="
        echo -e "\033[0;35m 系统空间      类型   总数  已用  可用 使用率\033[0m"
        df -hT "$PWD"

    - name: 上传bin目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.SOURCE_DIR }}/bin
        retention-days: 30

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd ${{ env.SOURCE_DIR }}/bin/targets/*/*
        rm -rf packages *.buildinfo *.manifest *.json *bl2.bin 2>/dev/null
        echo "整理后的固件文件:"
        ls -lh
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ 固件文件整理完成"

    - name: 上传固件到Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7

    - name: 上传到奶牛快传
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 上传到WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 生成发布信息
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cat > release.txt <<EOF
        ### ${DEVICE_TARGET}-immortalwrt 固件
        
        - 后台地址：${{ github.event.inputs.lan_ip }}
        - 登录账号：root
        - 登录密码：无
        - Luci版本：24.10
        - 内核版本：6.6
        - 5G高功率25db：${{ env.HIGH_POWER_5G == 'true' && '' || '未' }}启用
        - 默认主题：${{ github.event.inputs.default_theme }}
        - 主机名：${{ github.event.inputs.hostname }}
        
        #### 已选插件列表
        ```
        ${{ steps.extract_plugins.outputs.plugins }}
        ```
        
        #### 编译信息
        - 编译方式：${{ github.event.inputs.build_type }}
        - 源码URL：${REPO_URL}
        - 源码分支：${REPO_BRANCH}
        - 编译时间：$(date +"%Y-%m-%d %H:%M:%S %Z")
        - 工作流编号：#${{ github.run_number }}
        EOF
        echo "status=success" >> $GITHUB_OUTPUT
        cat release.txt
        echo "✅ 发布信息生成完成"

    - name: 上传固件到Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理旧缓存
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      run: |
        # 获取缓存列表并删除
        gh cache list --key ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}- --json key --jq '.[] | .key' | while read -r key; do
          gh cache delete "$key"
        done
        # 输出缓存状态
        echo "========cache status========"
        echo "ccache: $(du -sh $OPENWRT_PATH/.ccache | cut -f 1)"
        echo "staging: $(du -sh $OPENWRT_PATH/staging_dir | cut -f 1)"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 清理旧工作流记录
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 15
        keep_minimum_runs: 7
        repository: ${{ github.repository }}

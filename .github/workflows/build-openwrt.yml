name: 编译固件（RAX3000M-EMMC）

on:
  repository_dispatch:  
    types: [镜像更新触发自动编译固件]
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译方式'
        required: true
        default: 'Host'
        type: choice
        options:
          - Host
          - Docker
      lan_ip:
        description: '设置LAN IP地址'
        required: false
        default: '192.168.3.1'
      default_theme:
        description: '选择默认主题'
        required: false
        default: 'argon'
        type: choice
        options:
          - argon
          - bootstrap
      hostname:
        description: '设置主机名'
        required: false
        default: 'Rowrt'
      high_power_5g:
        description: '5G高功率25db'
        required: false
        default: true
        type: boolean
      ssh:
        description: '通过SSH连接到Actions'
        required: false
        default: false
        type: boolean
      cachewrtbuild_switch:
        description: '缓存加速编译'
        required: false
        default: true
        type: boolean
      # 移除clean_build配置

# 环境变量定义
env:
  # 基础配置
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # 用户可配置参数 - 优先使用 workflow_dispatch 输入，其次使用 repository_dispatch 的 client_payload
  LAN_IP: ${{ github.event.inputs.lan_ip || github.event.client_payload.inputs.lan_ip || '192.168.3.1' }}
  DEFAULT_THEME: ${{ github.event.inputs.default_theme || github.event.client_payload.inputs.default_theme || 'argon' }}
  HOSTNAME: ${{ github.event.inputs.hostname || github.event.client_payload.inputs.hostname || 'Rowrt' }}
  HIGH_POWER_5G: ${{ format('{0}', github.event.inputs.high_power_5g || github.event.client_payload.inputs.high_power_5g || 'true') }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || github.event.client_payload.inputs.build_type || 'Host' }}
  SSH: ${{ format('{0}', github.event.inputs.ssh || github.event.client_payload.inputs.ssh || 'false') }}
  CACHEWRTBUILD_SWITCH: ${{ format('{0}', github.event.inputs.cachewrtbuild_switch || github.event.client_payload.inputs.cachewrtbuild_switch || 'true') }}
  # 上传配置
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 统一目录并使用相对路径，兼容host和docker
  WORK_DIR: .
  SOURCE_DIR: ./openwrt
  # Docker相关配置
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/openwrt-builder:latest
  SRC_OPENWRT_DIR: /opt/openwrt # 容器内置源码目录
  DEFAULT_DIR: /opt/build #容器默认工作目录
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  # 新增缓存相关变量
  CCACHE_DIR: ./openwrt/.ccache
  CCACHE_SIZE: 10G
  CCACHE_COMPRESSION_LEVEL: 6
  DEVICE_NAME: cmcc_rax3000m-emmc
  KERNEL_VERSION: 6.6
  LUCI_VERSION: 24.10
  BUILD_SCRIPT: ./build-openwrt.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
    - name: 检查代码
      uses: actions/checkout@main

    - name: 检查服务器性能
      run: |
        echo "当前目录：$PWD"
        chmod +x ${{ env.BUILD_SCRIPT }}
        source ${{ env.BUILD_SCRIPT }}
        log_warn "警告" 0
        log_warn "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！" 0
        log_highlight "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n" 0
        log_info "--------------------------CPU信息--------------------------" 0
        log_highlight "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)" 0
        log_highlight "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n" 0
        log_info "--------------------------内存信息--------------------------" 0
        log_highlight "已安装内存详细信息：" 0
        ddrminfo="$(sudo lshw -short -C memory | grep GiB) \n"
        echo -e "$ddrminfo" | while IFS= read -r line; do
          log_highlight "$line" 0
        done
        log_info "--------------------------硬盘信息--------------------------" 0
        log_highlight "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" 0
        log_info "硬盘信息：" 0
        hddinfo="$(df -hT) \n"
        echo -e "$hddinfo" | while IFS= read -r line; do
          log_highlight "$line" 0
        done
    - name: 设置环境变量
      run: |
        # 根据触发来源设置环境变量
        source ${{ env.BUILD_SCRIPT }}
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          # 从repository-dispatch事件获取参数
          echo "REPO_URL=${{ github.event.client_payload.repo_url }}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${{ github.event.client_payload.repo_branch }}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${{ github.event.client_payload.commit_hash }}" >> $GITHUB_ENV
          echo "LAN_IP=${{ github.event.client_payload.lan_ip }}" >> $GITHUB_ENV
          echo "DEFAULT_THEME=${{ github.event.client_payload.default_theme }}" >> $GITHUB_ENV
          echo "HOSTNAME=${{ github.event.client_payload.hostname }}" >> $GITHUB_ENV
          echo "HIGH_POWER_5G=${{ github.event.client_payload.high_power_5g }}" >> $GITHUB_ENV
          echo "SSH=${{ github.event.client_payload.ssh }}" >> $GITHUB_ENV
          echo "CACHEWRTBUILD_SWITCH=${{ github.event.client_payload.cachewrtbuild_switch }}" >> $GITHUB_ENV
          echo "COMMIT_LOGS=${{ github.event.client_payload.commit_logs }}" >> $GITHUB_ENV
          echo "TRIGGER_SOURCE=${{ github.event.client_payload.trigger_source }}" >> $GITHUB_ENV
          log_info "从源码更新检测工作流触发，使用传递的参数"
        else
          log_highlight "手动触发，使用默认参数或指定参数" 1
        fi
        
        # 输出当前使用的参数
        log_highlight "使用的源码仓库: ${{ env.REPO_URL }}" 1
        log_highlight "使用的源码分支: ${{ env.REPO_BRANCH }}" 1
        if [ -n "${{ env.COMMIT_HASH }}" ]; then
          log_highlight "触发更新的提交哈希: ${{ env.COMMIT_HASH }}" 1
        fi
        if [ -n "${{ env.TRIGGER_SOURCE }}" ]; then
          log_highlight "触发来源: ${{ env.TRIGGER_SOURCE }}" 1
        fi
        if [ -n "${{ env.COMMIT_LOGS }}" ]; then
          log_highlight "触发更新的提交日志: ${{ env.COMMIT_LOGS }}" 1
        fi

    - name: 初始化编译环境（主机模式）
      if: env.BUILD_TYPE == 'Host'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        cd "${{ env.WORK_DIR }}"
        source ${{ env.BUILD_SCRIPT }}
        init_env

    - name: 启动Docker容器（Docker模式）
      if: env.BUILD_TYPE == 'Docker'
      run: |
        source ${{ env.BUILD_SCRIPT }}
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        FILTERED_TAGS=$(skopeo list-tags docker://ghcr.io/${{ github.repository_owner }}/openwrt-builder | \
        grep -oE '"(ubuntu22.04|latest|[0-9]{12})"' | \
        tr -d '"' | \
        sort -r | \
        awk 'BEGIN{seen["ubuntu22.04"]=0; seen["latest"]=0} { \
          if ($1 ~ /^[0-9]{12}$/) { \
            if (!latest_ts) {latest_ts=$1; print $1} \
          } else if (!seen[$1]++) { \
            print $1 \
          } \
        }')
        log_info "本次镜像的标签：" 0
        echo -e "$FILTERED_TAGS" | while IFS= read -r line; do
          log_highlight "$line" 0
        done
        log_info "-----------------" 0
        log_info "开始打包环境变量到容器" 0
        > .env
        printenv | grep -E '^[a-zA-Z0-9_]+=([^\(\)]|$)' | while IFS='=' read -r var value; do
          # log_info "环境变量：var：$var|value：$value" 0
          echo "$var=$value" >> .env
        done
        log_info "环境变量打包完成，共$(grep -c '=' .env)个变量" 0
        docker pull "${{ env.DOCKER_IMAGE }}"
        CURRENT_UID=$(id -u)
        CURRENT_GID=$(id -g)
        echo "当前用户ID: $CURRENT_UID, 组ID: $CURRENT_GID" >> $GITHUB_ENV
        docker run -d --name builder \
          --user $CURRENT_UID:$CURRENT_GID \
          --env-file .env \
          -v "$PWD":"${{ env.DEFAULT_DIR }}":rw \
          -e TZ="${{ env.TZ }}" \
          -e FORCE_UNSAFE_CONFIGURE=1 \
          "${{ env.DOCKER_IMAGE }}" tail -f /dev/null
        log_separator "验证容器运行状态" 0
        docker ps -a | grep builder
        if [ $? -ne 0 ]; then
          log_error "❌ 容器启动失败，请查看日志：" 0
          log_error "$(docker logs builder)" 0
          exit 1
        fi
        log_success "容器运行正常" 0
        
        log_separator "迁移预置源码到共享目录" 0
        docker exec builder bash -c '
          source ${{ env.BUILD_SCRIPT }}
          if [ -d "$SOURCE_DIR" ]; then
            log_warn "清理共享目录旧内容：$SOURCE_DIR" 0
            rm -rf "$SOURCE_DIR"/* "$SOURCE_DIR"/.* 2>/dev/null
          else
            mkdir -p "$SOURCE_DIR" && chmod 777 "$SOURCE_DIR"
          fi
          log_info "开始复制源码（含隐藏文件）..." 0
          cp -a "${SRC_OPENWRT_DIR}/." "${SOURCE_DIR}"
          critical_files=("scripts/feeds" "target/linux" "package")
          for file in "${critical_files[@]}"; do
            check_path="$SOURCE_DIR/$file"
            if [ ! -e "$check_path" ]; then
              log_error "迁移失败：共享目录缺失关键文件 $check_path" 0
              exit 1
            fi
          done
          log_success "预置源码迁移完成" 0
          log_highlight "  - 从：$SRC_OPENWRT_DIR" 0
          log_highlight "  - 到：""$SOURCE_DIR" 0
          log_highlight "共享目录源码体积：$(du -sh "$SOURCE_DIR" | awk "{print \$1}")" 0
          cp -f "$WORK_DIR/$CONFIG_FILE" "$SOURCE_DIR/.config" && log_success "已加载.config文件" 0
          cd "$SOURCE_DIR"
          make defconfig > /dev/null 2>&1
        '

    - name: 克隆源码（主机模式）
      if: env.BUILD_TYPE == 'Host'
      run: |
        source ${{ env.BUILD_SCRIPT }} && prepare_source

    - name: 加载自定义feeds
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.BUILD_SCRIPT }} && load_custom_feeds
        else
          docker exec builder bash -c 'source ${{ env.BUILD_SCRIPT }} && load_custom_feeds'
        fi
    
    - name: 更新并安装feeds
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.BUILD_SCRIPT }} &&update_install_feeds
        else
          docker exec builder bash -c 'source ${{ env.BUILD_SCRIPT }} && update_install_feeds'
        fi
    
    - name: 加载自定义配置
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.BUILD_SCRIPT }} && load_custom_config
        else
          docker exec builder bash -c 'source ${{ env.BUILD_SCRIPT }} && load_custom_config' 
        fi
      
    - name: SSH远程连接（make menuconfig）
      uses: rogueme/debugger-action@main
      if: (env.SSH == 'true' || env.SSH == true) || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        TIMEOUT_MIN: 360
          
    - name: 同步.config（仅SSH模式）
      if: (env.SSH == 'true' || env.SSH == true) || contains(github.event.action, 'ssh')
      run: |
        source ${{ env.BUILD_SCRIPT }}
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        cd "$WORK_DIR"
        CONFIG_SOURCE="$SOURCE_DIR/.config"
        cp -f "$CONFIG_SOURCE" "$CONFIG_FILE" && echo_color g "已复制$CONFIG_SOURCE到项目根目录"
        if git diff --quiet "$CONFIG_FILE"; then
            log_info ".config未修改，无需上传" 0
        else
            git add "$CONFIG_FILE"
            git commit -m "自动同步SSH修改的.config（Actions #${GITHUB_RUN_NUMBER}）"
            git push "https://${{ secrets.REPO_TOKEN }}@github.com/${{ github.repository }}.git" "${{ github.ref }}"
            log_success ".config已上传" 0
        fi

    - name: 提取已选插件列表
      id: extract_plugins
      run: |
        source ${{ env.BUILD_SCRIPT }}
        plugins=$(grep -E '^CONFIG_PACKAGE_luci-(app|theme)-.*=y$' "$WORK_DIR/$CONFIG_FILE" | 
          awk -F'[=]' '{name = substr($1, 16); print "  " name}')
        [ -z "$plugins" ] && plugins="  无额外插件（仅基础系统）"
        # 使用标准的EOF格式输出多行文本
        {
          echo "plugins_list<<EOF"
          echo "$plugins"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        log_info "--已选插件列表--" 0
        echo -e "$plugins" | while IFS= read -r line; do
          log_highlight "$line" 0
        done

        cat > release.txt <<EOF
        ### ${DEVICE_NAME}-immortalwrt 固件
        
        - 后台地址：${{ env.LAN_IP }}
        - 登录账号：root
        - 登录密码：无
        - 设备信息：${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        - 设备型号：${{ env.DEVICE_NAME }}
        - Luci版本：${{ env.LUCI_VERSION }}
        - 内核版本：${{ env.KERNEL_VERSION }}
        - 5G高功率25db：${{ env.HIGH_POWER_5G == 'true' && '已' || '未' }}启用
        - 默认主题：${{ env.DEFAULT_THEME }}
        - 主机名：${{ env.HOSTNAME }}
        
        #### 已选插件列表
        ```
        ${{ steps.extract_plugins.outputs.plugins_list }}
        ```
        
        #### 编译信息
        - 编译方式：${{ env.BUILD_TYPE }}
        - 源码URL：${REPO_URL}
        - 源码分支：${REPO_BRANCH}
        - 编译时间：$(date +"%Y-%m-%d %H:%M:%S %Z")
        - 工作流编号：#${{ github.run_number }}
        EOF
        cat release.txt
        log_success "发布信息生成完成" 0

    - name: 提取缓存相关变量
      run: |
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
        echo "CACHE_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "DEVICE_NAME=$(grep '^CONFIG_TARGET_PROFILE="DEVICE_' .config | sed -E 's/^CONFIG_TARGET_PROFILE="DEVICE_(.*)"/\1/')" >> $GITHUB_ENV
        echo "KERNEL_VERSION=$(grep "^CONFIG_LINUX_[0-9_]\+=y" .config | sed -r 's/CONFIG_LINUX_([0-9]+)_([0-9]+)=y/\1.\2/')" >> $GITHUB_ENV

    - name: 缓存加速编译
      if: env.CACHEWRTBUILD_SWITCH == 'true' || env.CACHEWRTBUILD_SWITCH == true
      uses: actions/cache@main
      with:
        key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.HASH }} ${{ env.CACHE_DATE }}
        restore-keys: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
        path: |
          ${{ env.SOURCE_DIR }}/.ccache
          ${{ env.SOURCE_DIR }}/staging_dir

    - name: 刷新缓存
      if: env.CACHEWRTBUILD_SWITCH == 'true' || env.CACHEWRTBUILD_SWITCH == true
      run: |
        if [ -d "${{ env.SOURCE_DIR }}/staging_dir" ]; then
          find "${{ env.SOURCE_DIR }}/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
          done
        fi

    - name: 下载软件包
      id: package
      run: |
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          source ${{ env.BUILD_SCRIPT }} && download_packages
        else
          docker exec builder bash -c 'source ${{ env.BUILD_SCRIPT }} && download_packages'
        fi
 
    - name: 释放Ubuntu磁盘空间
      uses: danshui-git/free-disk-space@main
      continue-on-error: true
      timeout-minutes: 15
      with:
        remove_android: false
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_docker_image: ${{ github.event.inputs.build_type == 'Host' && 'true' || 'false' }}
        remove_packages: "microsoft-edge-stable google-chrome-stable firefox postgresql* *llvm* mysql* dotnet-sdk-*"
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
        # 如果释放空间不够可在remove_packages添加google-cloud-cli、temurin-*、azure-cli
        # 如果释放空间不够可在remove_folders添加/usr/local/lib/node_modules
        # 如果释放空间不够可将remove_android改为true

    - name: 查看清理后磁盘空间
      if: (!cancelled())
      run: |
        source ${{ env.BUILD_SCRIPT }}
        log_info "===== 磁盘空间 =====" 0
        log_highlight "系统空间      类型   总数  已用  可用 使用率" 0
        log_highlight "$(df -hT "$PWD")" 0
        
    - name: 编译固件
      id: compile
      run: |
        source ${{ env.BUILD_SCRIPT }} 
        if [[ "${{ github.event.inputs.build_type }}" == "Host" ]]; then
          compile_firmware
        else
          docker exec builder bash -c 'source ${{ env.BUILD_SCRIPT }} && compile_firmware'
        fi
        if [[ $compile_exit_code -ne 0 ]]; then
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        FILE_DATE="_$(date +"%Y%m%d%H%M")"
        echo "FILE_DATE=${FILE_DATE}" >> $GITHUB_ENV
        EXTRACTED_LUCI_VERSION=$(grep -oP 'CONFIG_VERSION_NUMBER="\K[0-9]+\.[0-9]+\.[0-9]+' \
        ${{ env.SOURCE_DIR }}/build_dir/target-*/linux-*/linux-*/.config 2>/dev/null | head -n 1)
        LUCI_VERSION=${EXTRACTED_LUCI_VERSION:-${{ env.LUCI_VERSION }}}
        echo "LUCI_VERSION=${LUCI_VERSION}" >> $GITHUB_ENV
        EXTRACTED_KERNEL_VERSION=$(grep -oP 'CONFIG_LINUX_VERSION="\K[0-9]+\.[0-9]+\.[0-9]+' \
        ${{ env.SOURCE_DIR }}/build_dir/target-*/linux-*/linux-*/.config 2>/dev/null | head -n 1)
        KERNEL_VERSION=${EXTRACTED_KERNEL_VERSION:-${{ env.KERNEL_VERSION }}}
        echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV

    - name: 检查编译后磁盘空间
      if: (!cancelled())
      run: |
        source ${{ env.BUILD_SCRIPT }}
        log_info "===== 磁盘空间 =====" 0
        log_highlight "系统空间      类型   总数  已用  可用 使用率" 0
        log_highlight "$(df -hT "$PWD")" 0

    - name: 上传bin目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.SOURCE_DIR }}/bin
        retention-days: 30

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        set -e
        source ${{ env.BUILD_SCRIPT }}
        log_highlight "DEVICE_TARGET: $DEVICE_TARGET" 0
        log_highlight "DEVICE_SUBTARGET: $DEVICE_SUBTARGET" 0
        log_highlight "SOURCE_DIR: ${{ env.SOURCE_DIR }}" 0
        log_highlight "当前工作目录: $PWD" 0
        WILDCARD_PATH="${{ env.SOURCE_DIR }}/bin/targets/*/*"
        KNOWN_FIRMWARE_DIR="${{ env.SOURCE_DIR }}/bin/targets/${DEVICE_TARGET}/${DEVICE_SUBTARGET}"
        
        # 先尝试通过通配符查找固件目录
        WILDCARD_DIRS=$(ls -d "$WILDCARD_PATH" 2>/dev/null)
        DIR_COUNT=$(echo "$WILDCARD_DIRS" | wc -l)
        
        if [ $DIR_COUNT -eq 1 ]; then
          log_success "通过通配符成功找到唯一固件目录: $WILDCARD_DIRS" 0
          cd "$WILDCARD_DIRS"
        else
          # 通配符查找失败或找到多个目录，尝试使用精准路径
          if [ -d "$KNOWN_FIRMWARE_DIR" ]; then
            log_success "通过精准路径成功找到固件目录: $KNOWN_FIRMWARE_DIR" 0
            cd "$KNOWN_FIRMWARE_DIR"
          else
            log_error "未找到固件目录！可能的路径：" 0
            log_warn "- 精准路径: $KNOWN_FIRMWARE_DIR" 0
            log_warn "- 通配符路径: $WILDCARD_PATH" 0
            log_warn "- 找到的目录数量: $DIR_COUNT" 0
            if [ $DIR_COUNT -gt 1 ]; then
              log_warn "找到多个目录: $WILDCARD_DIRS" 0
            fi
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi
        
        rm -rf packages *.buildinfo *.manifest *.json *bl2.bin 2>/dev/null || log_warn "注意：某些文件可能不存在，继续处理" 0
        
        # 显示整理后的固件文件
        log_highlight "整理后的固件文件:" 0
        ls -lh || log_warn "警告：无法列出文件" 0
        
        # 设置成功状态和环境变量
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        log_success "固件文件整理完成" 0

    - name: 上传固件到Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7

    - name: 上传到奶牛快传
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        source ${{ env.BUILD_SCRIPT }}
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        log_info "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)" 0
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 上传到WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        source ${{ env.BUILD_SCRIPT }}
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        log_info "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)" 0
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 生成发布信息
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        source ${{ env.BUILD_SCRIPT }}
        cat > release.txt <<EOF
        ### ${DEVICE_NAME}-immortalwrt 固件
        
        - 后台地址：${{ env.LAN_IP }}
        - 登录账号：root
        - 登录密码：无
        - 设备信息：${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        - 设备型号：${{ env.DEVICE_NAME }}
        - Luci版本：${{ env.LUCI_VERSION }}
        - 内核版本：${{ env.KERNEL_VERSION }}
        - 5G高功率25db：${{ env.HIGH_POWER_5G == 'true' && '已' || '未' }}启用
        - 默认主题：${{ env.DEFAULT_THEME }}
        - 主机名：${{ env.HOSTNAME }}
        
        #### 已选插件列表
        ```
        ${{ steps.extract_plugins.outputs.plugins_list }}
        ```
        
        #### 编译信息
        - 编译方式：${{ env.BUILD_TYPE }}
        - 源码URL：${REPO_URL}
        - 源码分支：${REPO_BRANCH}
        - 编译时间：$(date +"%Y-%m-%d %H:%M:%S %Z")
        - 工作流编号：#${{ github.run_number }}
        EOF
        echo "status=success" >> $GITHUB_OUTPUT
        cat release.txt
        log_success "发布信息生成完成" 0

    - name: 上传固件到Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ env.DEVICE_NAME }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理旧缓存
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      run: |
        source ${{ env.BUILD_SCRIPT }}
        # 获取缓存列表并删除
        gh cache list --key ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}- --json key --jq '.[] | .key' | while read -r key; do
          gh cache delete "$key"
        done
        # 输出缓存状态
        log_separator "缓存状态" 0
        log_highlight "ccache: $(du -sh $OPENWRT_PATH/.ccache | cut -f 1)" 0
        log_highlight "staging: $(du -sh $OPENWRT_PATH/staging_dir | cut -f 1)" 0
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: 清理旧工作流记录
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 15
        keep_minimum_runs: 7
        repository: ${{ github.repository }}

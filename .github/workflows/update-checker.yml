# 描述：源码更新自动检测工作流（获取两次哈希间完整更新日志）
#

name: 固件源码更新检测器

env:
  # 目标监控的源码仓库信息
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6  # 源码仓库URL
  REPO_BRANCH: openwrt-24.10-6.6  # 监控分支

# 工作流触发条件
on:
  schedule:
    - cron: 0 18 * * *  # 定时触发：每天UTC时间18点（北京时间凌晨2点）自动执行
  workflow_dispatch:  # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：恢复上次的提交哈希缓存
      - name: 恢复上次提交哈希缓存
        id: restoreCache
        uses: actions/cache@main
        with:
          path: .commitHash  # 缓存文件路径
          key: commitHash  # 使用固定的缓存键

      # 步骤2：获取最新提交信息和更新日志
      - name: 获取最新提交信息
        id: getCommitInfo
        run: |
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 开始执行源码更新检测..."
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 目标仓库：${REPO_URL}（分支：${REPO_BRANCH}）"

          git init
          git remote add origin "${REPO_URL}"
          git fetch --depth 100 origin "${REPO_BRANCH}" || git fetch origin "${REPO_BRANCH}"
          
          COMMIT_HASH=$(git rev-parse origin/${REPO_BRANCH})
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 成功获取最新提交哈希：${COMMIT_HASH}"
          
          if [ -f .commitHash ]; then
            LAST_HASH=$(cat .commitHash)
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 上次记录的哈希值：${LAST_HASH}"
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 正在获取两次提交之间的更新日志..."
            try_count=0
            max_tries=3
            COMMIT_LOGS=""
            
            while [ $try_count -lt $max_tries ]; do
              if git log --pretty=format:"%h: %s%nAuthor: %an%nDate: %ad%n" --date=format:"%Y-%m-%d %H:%M:%S" ${LAST_HASH}..${COMMIT_HASH} > /tmp/commit_logs.txt 2>/dev/null; then
                COMMIT_LOGS=$(cat /tmp/commit_logs.txt)
                break
              else
                try_count=$((try_count+1))
                echo "[$(date +'%Y-%m-%d %H:%M:%S')] 尝试 $try_count: 无法直接获取两次哈希之间的日志，可能是提交历史超过了获取深度。"
                
                git log -10 --pretty=format:"%h: %s%nAuthor: %an%nDate: %ad%n" --date=format:"%Y-%m-%d %H:%M:%S" origin/${REPO_BRANCH} > /tmp/commit_logs.txt
                COMMIT_LOGS=$(cat /tmp/commit_logs.txt)
                
                if [ $try_count -eq $max_tries ]; then
                  echo "[$(date +'%Y-%m-%d %H:%M:%S')] 已获取最新的10条提交日志作为备选。"
                  break
                fi
                
                git fetch --depth $((100 * (try_count + 1))) origin "${REPO_BRANCH}"
              fi
            done
          else
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 首次运行，无历史哈希记录，获取最新的10条提交日志。"
            COMMIT_LOGS=$(git log -10 --pretty=format:"%h: %s [%ad]" --date=format:"%Y-%m-%d %H:%M:%S" origin/${REPO_BRANCH})
          fi
          
          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 成功获取更新日志："
          echo "${COMMIT_LOGS}"
          
          echo "commitHash=${COMMIT_HASH}" >> ${GITHUB_OUTPUT}
          echo "commitLogs<<EOF" >> ${GITHUB_OUTPUT}
          echo "${COMMIT_LOGS}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}

      # 步骤3：对比提交哈希（判断是否有更新）
      - name: 对比提交哈希（检测更新）
        id: compareHash
        run: |
          CURRENT_HASH=${{ steps.getCommitInfo.outputs.commitHash }}
          echo "当前提交哈希: ${CURRENT_HASH}"
          
          if [ -f .commitHash ]; then
            LAST_HASH=$(cat .commitHash)
            echo "上次提交哈希: ${LAST_HASH}"
            
            if [ "${CURRENT_HASH}" = "${LAST_HASH}" ]; then
              echo "哈希值相同，源码无更新，无需触发镜像构建"
              echo "hasUpdate=false" >> ${GITHUB_OUTPUT}
            else
              echo "哈希值不同，检测到源码更新！"
              echo "hasUpdate=true" >> ${GITHUB_OUTPUT}
            fi
          else
            echo "首次运行，无历史哈希记录，视为有更新"
            echo "hasUpdate=true" >> ${GITHUB_OUTPUT}
          fi

      # 步骤6：有更新时触发镜像构建工作流
      - name: 触发构建镜像
        if: steps.compareHash.outputs.hasUpdate == 'true'
        run: |
          echo "=== 安装jq工具用于解析JSON ==="
          sudo apt-get update
          sudo apt-get install -y jq
          echo "✅ jq工具安装完成"
          echo "当前jq版本：$(jq --version)"
          echo "=== 开始触发构建镜像工作流 ==="
          ESCAPED_COMMIT_LOGS=$(echo "${{ steps.getCommitInfo.outputs.commitLogs }}" | jq -Rsa .)
          BUILD_TRIGGER_PAYLOAD=$(cat << EOF
          {
            "event_type": "自动构建集成固件依赖镜像",
            "client_payload": {
              "inputs": {
                "repo_url": "${{ env.REPO_URL }}",
                "repo_branch": "${{ env.REPO_BRANCH }}",
                "commit_hash": "${{ steps.getCommitInfo.outputs.commitHash }}",
                "commit_logs": ${ESCAPED_COMMIT_LOGS},
                "trigger_source": "检测固件源码更新"
              }
            }
          }
          EOF
          )
          
          # 发送请求触发工作流
          RESPONSE=$(curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$BUILD_TRIGGER_PAYLOAD" 2>&1)
          
          # 检查触发结果
          if [ $? -eq 0 ]; then
            echo "✅ 构建镜像工作流已成功触发"
            echo "触发参数:"
            echo "  - 固件源码URL: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.repo_url')"
            echo "  - 固件源码分支: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.repo_branch')"
            echo "  - 最新哈希值: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.commit_hash')"
            echo "  - 最新提交日志: $(echo "$BUILD_TRIGGER_PAYLOAD" | jq -r '.client_payload.inputs.commit_logs')"
            # 将新哈希写入文件，用于下次缓存对比
            echo ${{ steps.getCommitInfo.outputs.commitHash }} > .commitHash
            if [ $? -eq 0 ]; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] 已保存新提交哈希：${{ steps.getCommitInfo.outputs.commitHash }}"
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] 保存新提交哈希${{ steps.getCommitInfo.outputs.commitHash }}失败！"
            fi
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 哈希值文件权限: $(ls -la .commitHash)"
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] 哈希值文件内容: $(cat .commitHash)"
          else
            echo "❌ 构建容器工作流触发失败！"
            echo "错误信息: $RESPONSE"
            # 不中断流程，仅记录错误
          fi
      # 步骤7：清理旧工作流记录（保持页面整洁）
      - name: 清理旧工作流记录
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 3  # 仅保留3天内的记录
          keep_minimum_runs: 3  # 最少保留3条记录（避免清空）
